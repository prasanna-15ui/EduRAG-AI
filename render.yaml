services:
  - type: web
    name: edurag-ai-backend
    env: python
    buildCommand: "./backend/start.sh build"
    startCommand: "./backend/start.sh start"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: PINECONE_API_KEY
        sync: false
      - key: PINECONE_INDEX
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
